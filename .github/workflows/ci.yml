name: CI

on:
  push:
    branches: [main, guide-formats-muse-image]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Install video dependencies (real Remotion renderer)
        working-directory: video
        run: npm ci --no-audit --no-fund
      - name: Prebuild Remotion bundle (renders use the same bundle as prod)
        working-directory: video
        run: npm run bundle
      - name: Build frontend (backend serves the built PWA; static-route tests need it)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Run backend tests
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc -b --force
      - name: Run frontend tests
        run: npm run test
      - name: Production build
        run: npm run build

  video:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck composition
        run: npx tsc --noEmit -p .
      - name: Run asset-server tests
        run: npm test

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Install frontend + Playwright
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium --only-shell || npx playwright install chromium
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run browser smoke (procedures → job → blocked → finish)
        run: |
          (cd backend && python -m uvicorn app.main:app --port 8000 & echo $! > /tmp/api.pid)
          sleep 6
          curl -sf http://localhost:8000/api/procedures > /dev/null
          (cd frontend && npx playwright test -c playwright.config.ts)
          kill $(cat /tmp/api.pid) || true
